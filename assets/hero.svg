<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title"><title id="title">Yashi Shah: full stack developer exploring agentic AI, with an animated ASCII portrait</title><style>text{white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes rain{from{transform:translateY(-38px)}to{transform:translateY(48px)}}
@keyframes pulse{50%{opacity:.72}}
.type{animation:reveal .8s steps(32,end) both}.row{animation:appear .5s both}
.cursor{animation:blink 1.1s step-end infinite}.portrait{animation:pulse 7s ease-in-out 3s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;clip-path:none!important;opacity:1!important}}
</style><rect x="0" y="0" width="1000" height="560" fill="#0d1117" rx="16"/><rect x="1" y="1" width="998" height="558" fill="#0d1117" rx="16" stroke="#30363d"/><rect x="2" y="2" width="996" height="42" fill="#161b22" rx="15"/><circle cx="25" cy="23" r="6" fill="#ff5f57"/><circle cx="47" cy="23" r="6" fill="#febc2e"/><circle cx="69" cy="23" r="6" fill="#28c840"/><text x="100" y="29" font-size="13" fill="#8b949e">yashi@github: ~</text><text x="30" y="86" font-size="13" fill="#bc8cff">BUILDER. TALKER. ALWAYS TRYING SOMETHING NEW.</text><text x="30" y="122" font-size="15" fill="#3fb950" class="type" style="animation-delay:0.00s">$ whoami</text><text x="30" y="148" font-size="15" fill="#c9d1d9" class="type" style="animation-delay:0.45s">yashi shah</text><text x="30" y="174" font-size="15" fill="#58a6ff" class="type" style="animation-delay:0.90s">full stack developer / agentic AI focus</text><text x="30" y="200" font-size="15" fill="#3fb950" class="type" style="animation-delay:1.35s">$ cat education.txt</text><text x="30" y="226" font-size="15" fill="#58a6ff" class="type" style="animation-delay:1.80s">B.Tech Information Technology</text><text x="30" y="252" font-size="15" fill="#58a6ff" class="type" style="animation-delay:2.25s">DJSCE, Mumbai</text><text x="30" y="278" font-size="15" fill="#8b949e" class="type" style="animation-delay:2.70s">2024–2028 · CGPA 8.66</text><text x="30" y="304" font-size="15" fill="#3fb950" class="type" style="animation-delay:3.15s">$ ls ./proof</text><text x="30" y="330" font-size="15" fill="#58a6ff" class="type" style="animation-delay:3.60s">internship  Twwios Technologies</text><text x="30" y="356" font-size="15" fill="#58a6ff" class="type" style="animation-delay:4.05s">ideathon    2nd runner-up · Oscillation 3.0</text><text x="30" y="382" font-size="15" fill="#58a6ff" class="type" style="animation-delay:4.50s">hackathon   TCS · Guardrail Eval</text><text x="30" y="408" font-size="15" fill="#58a6ff" class="type" style="animation-delay:4.95s">projects    SecureDrone · Last Minutes Deal</text><text x="30" y="434" font-size="15" fill="#3fb950" class="type" style="animation-delay:5.40s">$ status</text><text x="30" y="460" font-size="15" fill="#c9d1d9" class="type" style="animation-delay:5.85s">building agents that only do what</text><text x="30" y="486" font-size="15" fill="#c9d1d9" class="type" style="animation-delay:6.30s">they're allowed to, and checking that they do.</text><rect x="30" y="504" width="9" height="16" fill="#3fb950" class="cursor"/><path d="M470 75V526" stroke="#30363d"/><g class="portrait" xml:space="preserve"><text x="480" y="102.0" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.00s"></text><text x="480" y="110.8" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.04s"></text><text x="480" y="119.6" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.08s">                                 .    ..</text><text x="480" y="128.4" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.12s">                              ..,,,,::,,,,,,.....</text><text x="480" y="137.2" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.16s">                           ...,:,,,, ,,:::;;:::,,,..</text><text x="480" y="146.0" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.20s">                         ..,,;:::..    .. .:;--;;::,,..</text><text x="480" y="154.8" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.24s">                        .,,:-:,.           ...;+=-;;:,,..</text><text x="480" y="163.6" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.28s">                       .,:;=-,.      .  ....   .;==--;::,..</text><text x="480" y="172.4" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.32s">                     ..,:;=:,   .    .,...........:--=-;::,..</text><text x="480" y="181.2" font-size="8.5" fill="#58a6ff" class="row" style="animation-delay:0.36s