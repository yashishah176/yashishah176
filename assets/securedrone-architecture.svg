<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="SECUREDRONE: POST-QUANTUM COMMAND AND CONTROL · ATTACK SIMULATOR · LIVE AUDIT LOG">
<rect width="1200" height="540" rx="16" fill="#0b1626"/><rect x=".5" y=".5" width="1199" height="539" rx="16" fill="none" stroke="#1d3350"/>
<text x="22" y="36" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#e6edf3">SECUREDRONE</text>
<text x="22" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#8b9bb4">POST-QUANTUM COMMAND AND CONTROL · ATTACK SIMULATOR · LIVE AUDIT LOG</text>
<rect x="20" y="78" width="1160" height="196" rx="12" fill="none" stroke="#1d3350" stroke-opacity=".7"/><rect x="36" y="90" width="156" height="20" rx="10" fill="#58a6ff" fill-opacity=".18"/><text x="114" y="104" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#58a6ff">01 / COMMAND PATH</text><rect x="36" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="118.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Operator UI</text><text x="118.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">React + TypeScript</text><text x="118.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Send a flight command</text><text x="118.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">Ground station</text><line x1="204" y1="188" x2="219" y2="188" stroke="#58a6ff" stroke-width="2"/><path d="M217 183 L225 188 L217 193Z" fill="#58a6ff"/><rect x="228" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="310.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">FastAPI server</text><text x="310.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Builds the command</text><text x="310.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Adds nonce and time</text><text x="310.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">Shared drone API</text><line x1="396" y1="188" x2="411" y2="188" stroke="#58a6ff" stroke-width="2"/><path d="M409 183 L417 188 L409 193Z" fill="#58a6ff"/><rect x="420" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="502.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">ML-KEM-768</text><text x="502.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Post-quantum handshake</text><text x="502.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Agrees a session key</text><text x="502.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">NIST FIPS 203</text><line x1="588" y1="188" x2="603" y2="188" stroke="#58a6ff" stroke-width="2"/><path d="M601 183 L609 188 L601 193Z" fill="#58a6ff"/><rect x="612" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="694.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">ML-DSA-65</text><text x="694.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Signs the command</text><text x="694.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Proves who sent it</text><text x="694.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">NIST FIPS 204</text><line x1="780" y1="188" x2="795" y2="188" stroke="#58a6ff" stroke-width="2"/><path d="M793 183 L801 188 L793 193Z" fill="#58a6ff"/><rect x="804" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="886.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">AES-256-GCM</text><text x="886.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Encrypts the payload</text><text x="886.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Detects any change</text><text x="886.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">Authenticated</text><line x1="972" y1="188" x2="987" y2="188" stroke="#58a6ff" stroke-width="2"/><path d="M985 183 L993 188 L985 193Z" fill="#58a6ff"/><rect x="996" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#2ea043"/><text x="1078.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Drone checks</text><text x="1078.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Verify, decrypt</text><text x="1078.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Then execute</text><text x="1078.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#3fb950">About 0.2 ms extra</text><rect x="250" y="290" width="700" height="46" rx="8" fill="#0e1a2b" stroke="#1d3350"/><text x="600" y="309" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6edf3">ONE INTERFACE, TWO DRONES</text><text x="600" y="326" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">The simulator and a real PX4 drone sit behind the same API, so the security code never changes</text><rect x="20" y="352" width="1160" height="138" rx="12" fill="none" stroke="#1d3350" stroke-opacity=".7"/><rect x="36" y="364" width="185" height="20" rx="10" fill="#a78bfa" fill-opacity=".18"/><text x="129" y="378" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#a78bfa">02 / ATTACK SIMULATOR</text><rect x="36" y="396" width="152" height="62" rx="8" fill="#0e1a2b" stroke="#3b2a5c"/><text x="112" y="420" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa">Replay</text><text x="112" y="440" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Resend an old command</text><rect x="204" y="396" width="152" height="62" rx="8" fill="#0e1a2b" stroke="#3b2a5c"/><text x="280" y="420" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa">Tamper</text><text x="280" y="440" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Change bytes in transit</text><rect x="372" y="396" width="152" height="62" rx="8" fill="#0e1a2b" stroke="#3b2a5c"/><text x="448" y="420" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa">Forge</text><text x="448" y="440" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Fake the signature</text><rect x="540" y="396" width="152" height="62" rx="8" fill="#0e1a2b" stroke="#3b2a5c"/><text x="616" y="420" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa">Stale</text><text x="616" y="440" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Send it too late</text><line x1="712" y1="427" x2="746" y2="427" stroke="#58a6ff" stroke-width="2"/><path d="M744 422 L752 427 L744 432Z" fill="#58a6ff"/><rect x="756" y="384" width="190" height="86" rx="10" fill="#0e1a2b" stroke="#2ea043"/><text x="851.0" y="410" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Blocked</text><text x="851.0" y="432" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">All 4 rejected</text><text x="851.0" y="449" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">before execution</text><line x1="950" y1="427" x2="976" y2="427" stroke="#58a6ff" stroke-width="2"/><path d="M974 422 L982 427 L974 432Z" fill="#58a6ff"/><rect x="986" y="384" width="178" height="86" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="1075.0" y="410" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Live audit log</text><text x="1075.0" y="432" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Streamed over</text><text x="1075.0" y="449" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">WebSockets</text><text x="22" y="526" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" letter-spacing="1" fill="#5b6b84">DESIGN CHOICE: EVERY COMMAND IS CHECKED ON THE DRONE ITSELF, NOT TRUSTED BECAUSE IT ARRIVED.</text>
</svg>