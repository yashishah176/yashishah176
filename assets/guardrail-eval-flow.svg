<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="GUARDRAIL EVAL: LLM SAFETY EVALUATOR · TCS HACKATHON · FIVE RISK CATEGORIES">
<rect width="1200" height="330" rx="16" fill="#0b1626"/><rect x=".5" y=".5" width="1199" height="329" rx="16" fill="none" stroke="#1d3350"/>
<text x="22" y="36" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#e6edf3">GUARDRAIL EVAL</text>
<text x="22" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#8b9bb4">LLM SAFETY EVALUATOR · TCS HACKATHON · FIVE RISK CATEGORIES</text>
<rect x="22" y="86" width="220" height="130" rx="10" fill="#0e1a2b" stroke="#58a6ff"/><text x="132.0" y="112" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">1  Chatbot reply</text><text x="132.0" y="134" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Any LLM response</text><text x="132.0" y="151" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">sent to the API</text><text x="132.0" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">FastAPI endpoint</text><line x1="246" y1="151" x2="274" y2="151" stroke="#58a6ff" stroke-width="2"/><path d="M272 146 L280 151 L272 156Z" fill="#58a6ff"/><rect x="284" y="86" width="560" height="130" rx="10" fill="#0f2421" stroke="#1e5a4f"/><text x="564" y="108" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">2  Five risk checks</text><rect x="294" y="124" width="104" height="40" rx="7" fill="#0e1a2b" stroke="#1e5a4f"/><text x="346" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#2dd4bf">Data leakage</text><rect x="403" y="124" width="104" height="40" rx="7" fill="#0e1a2b" stroke="#1e5a4f"/><text x="455" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#2dd4bf">Unsafe content</text><rect x="512" y="124" width="104" height="40" rx="7" fill="#0e1a2b" stroke="#1e5a4f"/><text x="564" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#2dd4bf">Bias</text><rect x="621" y="124" width="104" height="40" rx="7" fill="#0e1a2b" stroke="#1e5a4f"/><text x="673" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#2dd4bf">Hallucination</text><rect x="730" y="124" width="104" height="40" rx="7" fill="#0e1a2b" stroke="#1e5a4f"/><text x="782" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#2dd4bf">Unsupported claims</text><text x="564" y="196" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Each flag gets a severity score and a reason</text><line x1="848" y1="151" x2="876" y2="151" stroke="#58a6ff" stroke-width="2"/><path d="M874 146 L882 151 L874 156Z" fill="#58a6ff"/><rect x="886" y="86" width="292" height="130" rx="10" fill="#0e1a2b" stroke="#2ea043"/><text x="1032.0" y="112" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">3  Safer output</text><text x="1032.0" y="134" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Severity · explanation</text><text x="1032.0" y="151" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Redacted rewrite of the reply</text><text x="1032.0" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#3fb950">Shown on a dashboard</text><rect x="22" y="232" width="376" height="76" rx="8" fill="#0e1a2b" stroke="#1d3350"/><text x="36" y="254" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e6edf3">MEASURED, NOT ASSUMED</text><text x="36" y="274" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Precision, recall, F1 and confusion</text><text x="36" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">matrices on a held-out set.</text><rect x="412" y="232" width="376" height="76" rx="8" fill="#0e1a2b" stroke="#1d3350"/><text x="426" y="254" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e6edf3">HONEST RESULT</text><text x="426" y="274" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">100% precision but 62% recall: rules</text><text x="426" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">rarely cry wolf, but they miss things.</text><rect x="802" y="232" width="376" height="76" rx="8" fill="#0e1a2b" stroke="#1d3350"/><text x="816" y="254" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e6edf3">REGRESSION DIFFS</text><text x="816" y="274" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Each run is compared with the last,</text><text x="816" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">so a change that hurts shows up.</text>
</svg>