<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" role="img" aria-labelledby="title"><title id="title">The agent loop I'm exploring: plan, call a tool, verify, evaluate, log</title><style>text{white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes rain{from{transform:translateY(-38px)}to{transform:translateY(48px)}}
@keyframes pulse{50%{opacity:.72}}
.type{animation:reveal .8s steps(32,end) both}.row{animation:appear .5s both}
.cursor{animation:blink 1.1s step-end infinite}.portrait{animation:pulse 7s ease-in-out 3s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;clip-path:none!important;opacity:1!important}}
</style><rect x="0" y="0" width="1000" height="180" fill="#0d1117" rx="16"/><text x="24" y="34" font-size="16" fill="#bc8cff">THE AGENT LOOP I’M EXPLORING</text><rect x="24" y="65" width="168" height="54" fill="#161b22" rx="8" stroke="#30363d"/><text x="108" y="98" font-size="16" fill="#58a6ff" text-anchor="middle">Plan</text><text x="200" y="98" font-size="20" fill="#3fb950">→</text><rect x="218" y="65" width="168" height="54" fill="#161b22" rx="8" stroke="#30363d"/><text x="302" y="98" font-size="16" fill="#58a6ff" text-anchor="middle">Call a tool</text><text x="394" y="98" font-size="20" fill="#3fb950">→</text><rect x="412" y="65" width="168" height="54" fill="#161b22" rx="8" stroke="#30363d"/><text x="496" y="98" font-size="16" fill="#58a6ff" text-anchor="middle">Verify</text><text x="588" y="98" font-size="20" fill="#3fb950">→</text><rect x="606" y="65" width="168" height="54" fill="#161b22" rx="8" stroke="#30363d"/><text x="690" y="98" font-size="16" fill="#58a6ff" text-anchor="middle">Evaluate</text><text x="782" y="98" font-size="20" fill="#3fb950">→</text><rect x="800" y="65" width="168" height="54" fill="#161b22" rx="8" stroke="#30363d"/><text x="884" y="98" font-size="16" fill="#58a6ff" text-anchor="middle">Log</text><text x="24" y="151" font-size="15" fill="#8b949e">Signed actions · scoped permissions · guardrails · audit logs</text></svg>